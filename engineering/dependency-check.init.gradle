// CI-only; keeps everyday build and existing release configuration untouched.
initscript {
    repositories { maven { url 'https://plugins.gradle.org/m2/' }; mavenCentral() }
    dependencies { classpath 'org.owasp:dependency-check-gradle:12.1.8' }
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.apply plugin: org.owasp.dependencycheck.gradle.DependencyCheckPlugin
    app.dependencyCheck {
        failBuildOnCVSS = 7.0
        failOnError = true
        formats = ['HTML', 'JSON']
        scanConfigurations = ['debugRuntimeClasspath']
        // The wrapper verifies all official feeds before exposing them over loopback.
        def feed = System.getenv('HERO_NVD_FEED_URL')
        def database = System.getenv('HERO_NVD_DATABASE')
        if (!feed || !(feed ==~ /http:\/\/127\.0\.0\.1:[0-9]+\/nvdcve-2\.0-\{0\}\.json\.gz/) || !database) {
            throw new GradleException('Use engineering/nvd_feed.py to prepare verified NVD data before scanning')
        }
        nvd.datafeedUrl = feed
        // A fresh database prevents a restored SQL cache from hiding CVE records.
        data.directory = database
        // npm audit is a separate mandatory CI step; avoid duplicate remote audits.
        analyzers.nodeAudit.enabled = false
        analyzers.nodePackage.enabled = false
    }
}
